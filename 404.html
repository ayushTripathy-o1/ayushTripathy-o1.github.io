<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>404 — Ayush Tripathy</title>
</head>

<body class="bg-black min-h-screen flex items-center justify-center">

    <div class="text-center text-white">
        <h1 class="text-7xl font-bold tracking-tight">
            404
        </h1>
        <p class="mt-2 text-sm text-white/50 font-medium">
            page not found
        </p>
        <div class="mt-8 w-80 border border-white/20 text-left">
            <div class="flex items-center gap-1 px-3 py-2 border-b border-white/10">
                <span class="text-white/30 text-xs">•</span>
                <span class="text-white/30 text-xs">•</span>
                <span class="text-white/30 text-xs">•</span>
                <span class="ml-2 text-xs text-white/40">
                    error
                </span>
            </div>
            <div class="p-4">
                <p class="text-xs text-white/50">
                    location
                </p>
                <p class="mt-1 text-sm text-white/80">
                    this page doesn't exist.
                </p>
                <button onclick="window.location.href='/'"
                    class="mt-5 w-full border border-white/20 px-3 py-2 text-sm text-white/70 hover:text-white hover:border-white/50 transition cursor-pointer">
                    go home ->
                </button>
            </div>
        </div>
        <p class="mt-6 text-xs text-white/30">
            Ayush Tripathy
        </p>
    </div>

</body>

</html>
